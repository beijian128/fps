syntax = "proto3";

package persist.player;

option go_package = "joltgo/persist/protos/player;playerpb";

enum REDBKey {
  REDB_KEY_UNSPECIFIED = 0;
  UserBagDB = 1;
  UserWalletDB = 2;
  UserProfileDB = 3;
}

enum DBSchemaVersion {
  DB_SCHEMA_VERSION_UNSPECIFIED = 0;
  DB_SCHEMA_VERSION_CURRENT = 1;
}

message DBUserWallet {
  int64 coins = 1;
  DBSchemaVersion schema_version = 2;
}

message DBUserBag {
  DBItems items = 1;
  string equipped_primary_weapon = 2;
  DBSchemaVersion schema_version = 3;

  message DBItems {
    repeated DBItem items = 1;
  }

  message DBItem {
    string item_id = 1;
    int64 quantity = 2;
    int64 acquired_at = 3;
  }
}

message DBUserProfile {
  int64 xp = 1;
  int32 kills = 2;
  int32 deaths = 3;
  int32 matches = 4;
  int32 wins = 5;
  int32 losses = 6;
  DBSchemaVersion schema_version = 7;
}

message DBMatchRecord {
  string match_id = 1;
  bool won = 2;
  int32 kills = 3;
  int32 deaths = 4;
  int32 opponent_kills = 5;
  int32 duration_seconds = 6;
  string opponent_name = 7;
  int64 ended_at = 8;
}
