// 游戏协议消息（wire 契约）。gate / match / game 三服务与 Godot 客户端都遵守。
// 线上 route 一律是三段式 `server.service.method`（pitaya 的路由格式）：
//   - 客户端 → gate → account：account.account.register / account.account.login /
//     account.account.resume（Request/Response，不是 Notify/Push —— 见 docs/API.md）
//   - 客户端 → gate → match：match.match.join（JoinMsg，Notify）
//   - match → 客户端：onMatched（MatchResult，Push —— 推送用 route 名，不是三段式）
//   - match → game（RPC）：game.game.create（CreateGameMsg）/ game.game.rejoin（RejoinMsg）
//   - match → gate（RPC）：gate.gate.bindgame（BindGameMsg）
//   - 客户端 → gate → game：game.game.cmd（CommandMsg）/ game.game.resync（空，Notify）
//   - game → 客户端：onFrame（Frame，Push）
//
// 同步不走手写快照，走通用「实体-属性」增量：属性表（Schema）在 full 帧里下发一次，
// 之后所有帧都是 (实体, 属性, 终值) 的 op。新增属性不需要改动本文件的字段定义。
//
// 序列化用 pitaya 的 protobuf serializer。

syntax = "proto3";

package game;

option go_package = "joltgo/game/protos";

// CommandMsg 是一帧的上行命令：把输入、射击、重置合并成一条消息发送
// （帧是最小发送单位）。shoot/reset 是边沿触发，未触发时为 false。
message CommandMsg {
  repeated float move = 1;   // [wx, wz]，世界空间水平期望速度（m/s）
  float yaw = 2;             // 水平朝向（弧度，绕 Y 轴）
  bool jump = 3;             // 跳跃边沿触发（服务端下一 tick 消费）
  bool shoot = 4;            // 射击边沿触发
  repeated float origin = 5; // [x, y, z] 枪口位置（shoot 为 true 时有效）
  repeated float dir = 6;    // [x, y, z] 射击方向（服务端会归一化）
  bool reset = 7;            // 重建场景边沿触发
}

// JoinMsg 是加入匹配的请求。身份来自会话绑定（account 服务在登录时做的），
// 这里不再携带任何凭证 —— 字段清空后 route 与 handler 签名都不变。
message JoinMsg {}

// RegisterMsg 是注册请求。用户名 3-16 位 [a-zA-Z0-9_]，密码 6-64 位。
message RegisterMsg {
  string username = 1;
  string password = 2;
}

// LoginMsg 是登录请求。
message LoginMsg {
  string username = 1;
  string password = 2;
}

// ResumeMsg 是凭证恢复请求：客户端持有 token，换回会话。
message ResumeMsg {
  string token = 1;
}

// LoginReply 是 register / login / resume 的统一应答，客户端用同一段代码处理。
// ok=false 时 reason 是机器可读的原因码（bad_credentials / name_taken /
// bad_username / bad_password / rate_limited / token_invalid / internal）。
message LoginReply {
  bool ok = 1;
  string token = 2;      // ok=true 时有效
  string username = 3;   // 保留用户输入的原始大小写，供 UI 显示
  string account_id = 4; // 十进制字符串，仅供诊断
  string reason = 5;     // ok=false 时的原因码
}

// BindGameMsg 是 match → gate 的 RPC 请求（route "gate.gate.bindgame"）：请玩家
// 所属的 gate 把对局归属写进它自己的会话数据（gate 据 gameServerId 定点路由
// game.*）。game_server_id 为空表示回滚（清掉归属）。
message BindGameMsg {
  string uid = 1;
  string game_server_id = 2;
  string match_id = 3;
  int32 player_idx = 4;
}

// BindGameReply 是 gate.gate.bindgame 的应答。found=false 表示该 gate 上没有
// 这个会话（玩家已掉线）。
message BindGameReply {
  bool found = 1;
}

// MatchResult 是匹配成功结果（match → 客户端 push route "onMatched"）。
message MatchResult {
  string match_id = 1;       // 对局 id
  string game_server_id = 2; // 分配到的 game 节点 id
  int32 player_idx = 3;      // 本客户端在局内的玩家槽位（0/1）
}

// CreateGameMsg 是 match → game 创建对局的 RPC 请求（route "game.create"）。
// uids 按槽位顺序（下标即 player_idx），1 个 = 单人兜底局。
message CreateGameMsg {
  string match_id = 1;
  repeated string uids = 2;
}

// CreateGameReply 是 game.create 的 RPC 应答（0 = 成功）。
message CreateGameReply {
  int32 code = 1;
}

// RejoinMsg 是 match → game 的回局查询（route "game.rejoin"）：问这个 game 节点
// 是否托管着该 token 的存量实例。
message RejoinMsg {
  string token = 1;
}

// RejoinReply 是 game.rejoin 的应答。
message RejoinReply {
  bool found = 1;
  string match_id = 2;
  int32 player_idx = 3; // 原本的玩家槽位（0/1）
}

// SchemaField 是一个同步属性的声明。
message SchemaField {
  uint32 id = 1;   // 属性 ID（Frame 里的 AttrValue.id）
  string name = 2; // 属性名，客户端按名字取值
  int32 kind = 3;  // 值类型，与 replication.Kind 取值一致
}

// Schema 是属性表，随 full 帧下发。
message Schema {
  repeated SchemaField fields = 1;
  uint32 version = 2; // 属性表哈希，客户端据此检测前后端不一致
}

// AttrValue 是一个属性的取值。按 schema 声明的 kind 取用其中一个字段。
message AttrValue {
  uint32 id = 1;
  repeated float f = 2; // KindF32(1 项) / KindVec2(2) / KindVec3(3) / KindVec4(4)
  int32 i = 3;          // KindI32
  bool b = 4;           // KindBool
  string s = 5;         // KindStr
}

// EntityDelta 是一个实体在本帧的变化。应用顺序：destroy → removed → set。
message EntityDelta {
  uint32 id = 1;
  bool destroy = 2;
  repeated uint32 removed = 3;
  repeated AttrValue set = 4;
}

// Frame 是一帧同步消息。full=true 表示全量帧（重连 / 首次进入），客户端应先
// 清空本地状态再整体覆盖；此时 schema 一并携带。
message Frame {
  int32 step = 1; // 帧号（= 服务端 tick 计数）
  bool full = 2;
  repeated EntityDelta entities = 3;
  Schema schema = 4;
}
