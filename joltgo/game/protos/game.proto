// game 的协议定义：game 推给客户端的消息 + 服务内部消息。
//
// 归属规则（与 gate/protos/gate.proto、match/protos/match.proto 一致，三份文件
// 之间**没有 import 关系**）：
//   - 客户端主动请求 → gate/protos/gate.proto
//   - match 推给客户端的 → match/protos/match.proto
//   - game 推给客户端的、以及服务之间的内部消息 → 本文件
//
// 内部消息留在这里是因为它们的双方（game ↔ logic / gate、gm → game）不涉及客户端；
// 其中 SlotResult 同时被下发的 MatchEnded 与上报的 RecordMatchMsg 使用，两个消息
// 都在本文件，所以零 import。
//
// 内部 RPC 的 route 一览（都是三段式，用 RegisterRemote 注册）：
//   - match → game：game.game.create（CreateGameMsg）/ game.game.rejoin（RejoinMsg）
//     / game.game.leave（LeaveMsg，放弃对局时把玩家从实例里摘出来）
//   - match → gate：gate.gate.bindgame（BindGameMsg）
//   - game → logic：logic.logic.recordmatch（RecordMatchMsg，战绩上报）
//   - account → logic：logic.logic.online（UserOnlineMsg）
//   - gm → match：match.match.addbots（AddBotsMsg）
//   - gm → logic：logic.logic.grantcoins（GrantCoinsMsg）
//
// 这些 route 客户端**发不到**：gate 只转发 gate/protos/gate.proto 里定义过的 route
// （见 joltgo/gate/routes.go 的 allowedRoutes）。
//
// 同步不走手写快照，走通用「实体-属性」增量：属性表（Schema）在 full 帧里下发一次，
// 之后所有帧都是 (实体, 属性, 终值) 的 op。新增属性不需要改动本文件的字段定义。
//
// 序列化用 pitaya 的 protobuf serializer。

syntax = "proto3";

package game;

option go_package = "joltgo/game/protos";

// ---- game 推给客户端的：onFrame ----

// SchemaField 是一个同步属性的声明。
message SchemaField {
  uint32 id = 1;   // 属性 ID（Frame 里的 AttrValue.id）
  string name = 2; // 属性名，客户端按名字取值
  int32 kind = 3;  // 值类型，与 replication.Kind 取值一致
}

// Schema 是属性表，随 full 帧下发。
message Schema {
  repeated SchemaField fields = 1;
  uint32 version = 2; // 属性表哈希，客户端据此检测前后端不一致
}

// AttrValue 是一个属性的取值。按 schema 声明的 kind 取用其中一个字段。
message AttrValue {
  uint32 id = 1;
  repeated float f = 2; // KindF32(1 项) / KindVec2(2) / KindVec3(3) / KindVec4(4)
  int32 i = 3;          // KindI32
  bool b = 4;           // KindBool
  string s = 5;         // KindStr
}

// EntityDelta 是一个实体在本帧的变化。应用顺序：destroy → removed → set。
message EntityDelta {
  uint32 id = 1;
  bool destroy = 2;
  repeated uint32 removed = 3;
  repeated AttrValue set = 4;
}

// Frame 是一帧同步消息。full=true 表示全量帧（重连 / 首次进入），客户端应先
// 清空本地状态再整体覆盖；此时 schema 一并携带。
message Frame {
  int32 step = 1; // 帧号（= 服务端 tick 计数）
  bool full = 2;
  repeated EntityDelta entities = 3;
  Schema schema = 4;
}

// ---- game 推给客户端的：onMatchEnded ----

// 单个槽位的结算数据。下标即 player_idx；uid 为空串表示该槽位没有真实玩家。
message SlotResult {
  string uid = 1;
  int32 kills = 2;
  int32 deaths = 3;
  // left = true：该槽位的玩家中途放弃了对局（uid 仍然是他的账号 ID）。
  // 结算方据此把这一位**排除在结算之外**（不计战绩、不推结算），而对局本身仍然
  // 是「两个人的局」—— 这正是「放弃 ≠ 没有对手」的区分点：
  // uid=="" 且 left=false 才是「这个槽位压根没人」，那种局不入账。
  bool left = 4;
}

// onMatchEnded 推送载荷：一局结束的权威信号。
message MatchEnded {
  string match_id = 1;
  int32 winner_slot = 2;
  repeated SlotResult slots = 3;
  int32 duration_seconds = 4;
}

// ---- 服务内部：match → gate ----

// BindGameMsg 是 match → gate 的 RPC 请求（route "gate.gate.bindgame"）：请玩家
// 所属的 gate 把对局归属写进它自己的会话数据（gate 据 gameServerId 定点路由
// game.*）。game_server_id 为空表示回滚（清掉归属）。
message BindGameMsg {
  string uid = 1;
  string game_server_id = 2;
  string match_id = 3;
  int32 player_idx = 4;
}

// BindGameReply 是 gate.gate.bindgame 的应答。found=false 表示该 gate 上没有
// 这个会话（玩家已掉线）。
message BindGameReply {
  bool found = 1;
}

// ---- 服务内部：match → game ----

// CreateGameMsg 是 match → game 创建对局的 RPC 请求（route "game.create"）。
// uids 按槽位顺序（下标即 player_idx），1 个 = 单人兜底局。
message CreateGameMsg {
  string match_id = 1;
  repeated string uids = 2;
}

// CreateGameReply 是 game.create 的 RPC 应答（0 = 成功）。
message CreateGameReply {
  int32 code = 1;
}

// RejoinMsg 是 match → game 的回局查询（route "game.rejoin"）：问这个 game 节点
// 是否托管着该 token 的存量实例。
message RejoinMsg {
  string token = 1;
}

// RejoinReply 是 game.rejoin 的应答。
message RejoinReply {
  bool found = 1;
  string match_id = 2;
  int32 player_idx = 3; // 原本的玩家槽位（0/1）
}

// LeaveMsg 是 match → game 的 RPC（route "game.game.leave"）：请托管该实例的 game
// 节点把这个玩家从对局里释放出来（见 AbandonMatchMsg 的语义）。uid 是会话 UID。
message LeaveMsg {
  string uid = 1;
}

// LeaveReply 是 game.leave 的应答。ok=false 表示这个 game 节点上没有该 uid 的实例
// （已经离场、或本来就不在这个节点上）。
message LeaveReply {
  bool ok = 1;
}

// ---- 服务内部：game → logic ----

// game → logic：一局分出胜负时的结算上报（remote route logic.logic.recordmatch）。
message RecordMatchMsg {
  string match_id = 1;
  repeated SlotResult slots = 2;
  int32 winner_slot = 3;
  int32 duration_seconds = 4;
}

message RecordMatchReply {
  bool ok = 1;
  bool applied = 2; // false = 收到但按规则未入账
  string reason = 3;
}

// ---- 服务内部：account → logic ----

message UserOnlineMsg {
  string account_id = 1;
}

message UserOnlineReply {
  bool ok = 1;
  string reason = 2;
}

// ---- 服务内部：gm → match / logic ----

// AddBotsMsg 是 gm → match 的 RPC（route "match.match.addbots"）：往匹配队列里
// 塞 N 个机器人凑人数。
//
// 这条 route 不会从客户端到达（不在 gate 的转发白名单里），因此不做调用方鉴权；
// 集群内部进程本就能调它，那不是鉴权能解决的问题。
message AddBotsMsg {
  int32 count = 1; // 期望入队的机器人数量，服务端另有单次上限
}

// AddBotsReply 是 match.match.addbots 的应答。
// reason：internal | noop（count<=0 时的空操作，ok 仍为 true）。
message AddBotsReply {
  bool ok = 1;
  int32 enqueued = 2; // 实际入队数量
  string reason = 3;
}

// GrantCoinsMsg 是 gm → logic 的 RPC（route "logic.logic.grantcoins"）：
// 给指定账号加（delta>0）或扣（delta<0）金币。用户名 → accountID 的解析在 gm 侧完成。
message GrantCoinsMsg {
  string account_id = 1;
  int64 delta = 2;
}

// GrantCoinsReply 是 logic.logic.grantcoins 的应答。
// reason：account_not_found | unauthenticated | profile_missing | internal。
message GrantCoinsReply {
  bool ok = 1;
  int64 coins = 2; // 变更后的余额（ok=true 时有效）
  string reason = 3;
}
